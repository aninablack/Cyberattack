name: Refresh Live Snapshot

on:
  workflow_dispatch:
  schedule:
  - cron: "*/30 * * * *
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Generate snapshot
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          ABUSEIPDB_API_KEY: ${{ secrets.ABUSEIPDB_API_KEY }}
          ABUSECH_API_KEY: ${{ secrets.ABUSECH_API_KEY }}
          OTX_API_KEY: ${{ secrets.OTX_API_KEY }}
          PULSEDIVE_API_KEY: ${{ secrets.PULSEDIVE_API_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          URLSCAN_API_KEY: ${{ secrets.URLSCAN_API_KEY }}
          SHODAN_API_KEY: ${{ secrets.SHODAN_API_KEY }}
          CENSYS_API_ID: ${{ secrets.CENSYS_API_ID }}
          CENSYS_API_SECRET: ${{ secrets.CENSYS_API_SECRET }}
          MAX_TOTAL_EVENTS: "320"
          MAX_URLHAUS_ROWS: "120"
          MAX_OPENPHISH_ROWS: "80"
          MAX_PHISHTANK_ROWS: "80"
          MAX_SPAMHAUS_CIDRS: "60"
          MAX_FIREHOL_IPS: "60"
          MAX_KEV_FETCH: "120"
          MAX_EPSS_SAMPLE: "60"
          MAX_OSV_EVENTS: "40"
          MAX_RANSOMWARE_LIVE_ROWS: "40"
          MAX_CIRCL_ROWS: "20"
        run: python scripts/generate_live_snapshot.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-threats.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh live snapshot"
          git push
