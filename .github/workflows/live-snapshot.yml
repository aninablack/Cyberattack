name: Refresh Live Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Generate snapshot
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          ABUSEIPDB_API_KEY: ${{ secrets.ABUSEIPDB_API_KEY }}
          ABUSECH_API_KEY: ${{ secrets.ABUSECH_API_KEY }}
          OTX_API_KEY: ${{ secrets.OTX_API_KEY }}
          PULSEDIVE_API_KEY: ${{ secrets.PULSEDIVE_API_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          URLSCAN_API_KEY: ${{ secrets.URLSCAN_API_KEY }}
          MAX_TOTAL_EVENTS: "500"
          MAX_URLHAUS_ROWS: "180"
          MAX_OPENPHISH_ROWS: "120"
          MAX_PHISHTANK_ROWS: "120"
          MAX_SPAMHAUS_CIDRS: "120"
          MAX_FIREHOL_IPS: "120"
          MAX_KEV_FETCH: "120"
          MAX_EPSS_SAMPLE: "60"
          MAX_OSV_EVENTS: "60"
          MAX_RANSOMWARE_LIVE_ROWS: "70"
          MAX_CIRCL_ROWS: "40"
        run: python scripts/generate_live_snapshot.py

      - name: Publish snapshot to Gist
        env:
          GIST_ID: ${{ secrets.SNAPSHOT_GIST_ID }}
          GIST_TOKEN: ${{ secrets.SNAPSHOT_GIST_TOKEN }}
          GIST_FILENAME: "live-threats.json"
        run: python scripts/publish_snapshot_to_gist.py
